envd = XCURSOR_SIZE,24
envd = SDL_VIDEODRIVER,wayland
envd = SDL_VIDEO_DRIVER,wayland
envd = CLUTTER_BACKEND,waylands
envd = XDG_CURRENT_DESKTOP,Hyprland
envd = XDG_SESSION_TYPE,wayland
envd = XDG_SESSION_DESKTOP,Hyprland 
envd = QT_QPA_PLATFORM,wayland
envd = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
envd = QT_QPA_PLATFORMTHEME,gtk3
envd = QT_STYLE_OVERRIDE,Breeze
envd = KDE_SESSION_VERSION,6
envd = GDK_BACKEND,wayland
envd = GTK_THEME,Breeze-Dark
envd = WLR_DRM_NO_ATOMIC,1

exec-once = $HOME/.config/hypr/scripts/init

$mainMod = SUPER
$fileManager = /bin/dolphin
# GPU-specific environment is applied by app wrappers, never by Hyprland itself.
$browser = $HOME/.local/bin/gpu-brave
$terminal = $HOME/.local/bin/gpu-ghostty

monitor=HDMI-A-1,preferred,0x0,2
monitor=eDP-1,preferred,auto,1,mirror,1
# monitor=,preferred,auto-up,1,mirror,eDP-1
monitor=,disable

bindl = ,switch:on:Lid Switch, exec, systemctl suspend-then-hibernate #lid close

general {
  border_size = 0
  gaps_in = 0
  gaps_out = 0
  resize_on_border = false
  layout = dwindle
  allow_tearing = true
}

decoration {
  rounding = 0
  dim_inactive = false
  dim_strength = 0.10
  blur {
    enabled = false
    xray = true
    size = 16
    ignore_opacity = false
    popups = true
  }
  shadow {
    enabled = false
  }
}
animations {
  enabled = false
  bezier = myBezier, 0.05, 0.9, 0.1, 1.05
  animation = windows, 1, 7, myBezier
  animation = windowsOut, 1, 7, default, popin 80%
  animation = border, 1, 10, default
  animation = borderangle, 1, 8, default
  animation = fade, 1, 7, default
  animation = workspaces, 1, 6, default
}

input {
  repeat_rate = 40
  repeat_delay = 190
  sensitivity = 0
  scroll_method = "2fg"
  follow_mouse = 1
  special_fallthrough = true
  emulate_discrete_scroll = 2

  touchpad {
    disable_while_typing = false
    natural_scroll = yes
    clickfinger_behavior = false
    tap-to-click = true
    drag_lock = true
    tap-and-drag = true
    scroll_factor = 1
  }

  scroll_factor = 4.5
}
gestures {
  workspace_swipe_forever = true
  workspace_swipe_direction_lock = false
}

group {
  groupbar {
    enabled = false
    render_titles = false
    height = -9
    scrolling = false
  }
}

misc {
  disable_hyprland_logo = false
  disable_splash_rendering = false
  force_default_wallpaper = 0
  mouse_move_focuses_monitor = true
  vrr = 1
  # vfr = true
  animate_mouse_windowdragging = true
  enable_swallow = true
}

binds {
  pass_mouse_when_bound = false
  scroll_event_delay = 200
  workspace_back_and_forth = true
  allow_workspace_cycles = false
  workspace_center_on = true
}

xwayland {
  force_zero_scaling = true
  create_abstract_socket = true
}

opengl {
  nvidia_anti_flicker = false
}

render {
  direct_scanout = 2
}

cursor {
  no_hardware_cursors = 0
  no_break_fs_vrr = 1
  inactive_timeout = 5
  hide_on_key_press = true
  zoom_rigid = true
  enable_hyprcursor = true
}

# dwindle {
#   pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
#   preserve_split = yes # you probably want this
# }

ecosystem {
  no_update_news = true
  no_donation_nag = true
  enforce_permissions = true
}

gesture = 3, horizontal, workspace
gesture = 3, vertical, resize
gesture = 3, pinchin, dispatcher, exec, hyprctl keyword cursor:zoom_factor $(awk "BEGIN {print $(hyprctl getoption cursor:zoom_factor | grep 'float:' | awk '{print $2}') + 1}")
gesture = 3, pinchout, dispatcher, exec, hyprctl keyword cursor:zoom_factor 1

gesture = 4, up, fullscreen
gesture = 4, down, float
gesture = 4, horizontal, move
gesture = 4, pinch, dispatcher, togglespecialworkspace, G4

bind = $mainMod, S, togglespecialworkspace, S
bind = $mainMod SHIFT, S, movetoworkspace, special:S
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod CTRL, 1, movetoworkspacesilent, 1
bind = $mainMod CTRL, 2, movetoworkspacesilent, 2
bind = $mainMod CTRL, 3, movetoworkspacesilent, 3
bind = $mainMod CTRL, 4, movetoworkspacesilent, 4
bind = $mainMod CTRL, 5, movetoworkspacesilent, 5
bind = $mainMod CTRL, 6, movetoworkspacesilent, 6
bind = $mainMod CTRL, 7, movetoworkspacesilent, 7
bind = $mainMod CTRL, 8, movetoworkspacesilent, 8
bind = $mainMod CTRL, 9, movetoworkspacesilent, 9
bind = $mainMod CTRL, 0, movetoworkspacesilent, 10

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod SHIFT, mouse:272, resizewindow
bindm = $mainMod, mouse:273, resizewindow

# bind = $mainMod, I, invertactivewindow, 
bind = $mainMod, C, killactive, 
bind = $mainMod, F, fullscreen,
#bind = $mainMod SHIFT, F, fakefullscreen,
bind = $mainMod, Space, togglefloating, 
# bind = $mainMod, P, pseudo, # dwindle
# bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, G, togglegroup, b
bind = $mainMod, TAB, changegroupactive, f
bind = $mainMod SHIFT, TAB, changegroupactive, b
bind = $mainMod SHIFT, left, movewindoworgroup, l
bind = $mainMod SHIFT, right, movewindoworgroup, r
bind = $mainMod SHIFT, up, movewindoworgroup, u
bind = $mainMod SHIFT, down, movewindoworgroup, d
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, X, exec, cd ~/projects/ai/stt && uv run start.py
bind = $mainMod, Z, exec, cd ~/projects/ai/stt && uv run stop.py
bind = $mainMod, L, exec, hyprlock
bindl = $mainMod SHIFT, M, exec, hyprlock --immediate --quiet & systemctl hibernate
bindl = $mainMod CTRL, M, exec, (echo toor|sudo -S efibootmgr -n0002) && systemctl hibernate

bindl = $mainMod ALT, E, exec, hyprctl dispatch exit
bindl = $mainMod, P, exec, hyprctl monitors | grep -q "eDP-1" && hyprctl keyword monitor "eDP-1, disable" || hyprctl keyword monitor "eDP-1,preferred,auto,1,mirror,1"

bind = $mainMod, Q, exec, daemonize $terminal
bind = $mainMod, T, exec, bash -c 'source ~/.bashrc; type-clipboard'
bind = $mainMod, B, exec, daemonize $browser
bind = $mainMod, E, exec, daemonize $fileManager
bind = $mainMod, N, exec, daemonize subl
bind = $mainMod, M, exec, daemonize dmenu-run-shell

bind = , Print, exec, (NAME=$(date +$HOME/Pictures/Screenshots/%Y-%m-%d_%H:%M:%S.%2N.png);slurp|grim -t png -g - $NAME;wl-copy < $NAME)
bind = $mainMod, Print, exec, (NAME=$(date +$HOME/Pictures/Screenshots/%Y-%m-%d_%H:%M:%S.%2N.png);echo 0, 0 1920x1080|grim -t png -g - $NAME;wl-copy < $NAME)
bind = SHIFT, Print, exec, (NAME=$(date +$HOME/Pictures/Screenshots/%Y-%m-%d_%H:%M:%S.%2N.png);hyprctl activewindow |awk '/at:/ {sum = $2_}/size:/ {print sum, $2}'|rev| sed -e 's/, /x/'|rev| grim -l 9 -t png -g - $NAME;wl-copy < $NAME)
bindle = CTRL , Insert, exec, $HOME/.config/hypr/scripts/brightness -
bindle = , Insert, exec, $HOME/.config/hypr/scripts/brightness +
bindle = CTRL SHIFT , Insert, exec, $HOME/.config/hypr/scripts/brightness +
bind = $mainMod SHIFT, Z, exec, upower -d /org/freedesktop/UPower/devices/battery_BAT0|grep percentage:|head -n1|sed 's/.*\([0-9][0-9]\).*/\1/'| wl-copy
bindle = , XF86MonBrightnessUp, exec, $HOME/.config/hypr/scripts/brightness +
bindle = , XF86MonBrightnessDown, exec, $HOME/.config/hypr/scripts/brightness -
bindle = , XF86ChannelUp, exec, $HOME/.config/hypr/scripts/contrast +
bindle = , XF86ChannelDown, exec, $HOME/.config/hypr/scripts/contrast -
# keyd bridges the unsupported KEY_CHANNELUP/DOWN codes through F14/F13.
# Hyprland raw keycodes are evdev codes plus the XKB offset of 8.
bindle = , code:192, exec, daemonize $HOME/.config/hypr/scripts/contrast +
bindle = , code:191, exec, daemonize $HOME/.config/hypr/scripts/contrast -
bindle = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 2.0 @DEFAULT_SINK@ 2%+ && wpctl get-volume @DEFAULT_SINK@ | awk '{muted=($0~/MUTED/?" muted":""); gsub(/[^0-9]/,"",$2); printf "%d%s\n",$2/2,muted}' | $HOME/.config/hypr/scripts/wob-push
bindle = , XF86AudioLowerVolume, exec, wpctl set-volume -l 2.0 @DEFAULT_SINK@ 2%- && wpctl get-volume @DEFAULT_SINK@ | awk '{muted=($0~/MUTED/?" muted":""); gsub(/[^0-9]/,"",$2); printf "%d%s\n",$2/2,muted}' | $HOME/.config/hypr/scripts/wob-push
bindle = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_SINK@ toggle && wpctl get-volume @DEFAULT_SINK@ | awk '{muted=($0~/MUTED/?" muted":""); gsub(/[^0-9]/,"",$2); printf "%d%s\n",$2/2,muted}' | $HOME/.config/hypr/scripts/wob-push
bind = $mainMod CTRL, R, exec, XDG_MENU_PREFIX=arch- kbuildsycoca6
bind = $mainMod CTRL, E, exec, systemctl restart --user wireplumber
bind = $mainMod CTRL SHIFT, O, exec, loginctl terminate-user $USER

bind = , F6, exec, ydotool click --repeat 20 --next-delay 6 0xC0
